<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Коканд Рынок</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <!-- HEADER -->
        <header class="header">
            <div class="header-top">

                <button class="icon-btn" id="qrBtn" type="button">
                    <img src="assets/icons/qr.svg" alt="QR" class="icon-img">
                </button>

                <div class="logo">
                    Коканд Рынок
                    <span class="logo-dot"></span>
                </div>

                <div class="header-actions">
                    <button class="icon-btn" id="favBtn" type="button">
                        <img src="assets/icons/heart.svg" alt="Избранное" class="icon-img">
                    </button>

                    <button class="icon-btn" id="cartBtn" type="button">
                        <img src="assets/icons/bag.svg" alt="Корзина" class="icon-img">
                        <div class="cart-badge" id="cartBadge">3</div>
                    </button>
                </div>
            </div>

            <div class="search-container">
                <img src="assets/icons/search.svg" alt="" class="search-icon">
                <input
                    type="text"
                    class="search-bar"
                    placeholder="Искать товары, бренды, категории..."
                    id="searchInput"
                >
            </div>
        </header>

        <!-- Промо баннер -->
        <div class="promo-banner" id="promoBanner">
            <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=200&h=200&fit=crop" alt="Акция" class="promo-img">
            <div class="promo-text">
                <h3>Скидка 20% на первый заказ!</h3>
                <p>Промокод: КОКАНДСТАРТ</p>
            </div>
        </div>

        <!-- Каталог -->
        <div class="section-title" id="catalogSection">
            <span>Каталог</span>
            <span class="see-all" id="seeAllCats">Все →</span>
        </div>

        <div class="categories-grid" id="categoriesGrid"></div>

        <!-- ТОП недели -->
        <div class="top-section">
            <div class="top-header">
                <div class="top-title">
                    <img src="assets/icons/fire.svg" alt="" class="title-icon">
                    ТОП недели
                </div>
                <div class="see-all-btn" id="seeAllTop">Все →</div>
            </div>

            <div class="products-scroll" id="productsScroll"></div>
        </div>

        <!-- Рекомендуем -->
        <div class="recommend-section">
            <div class="top-header">
                <div class="top-title">
                    <img src="assets/icons/sparkles.svg" alt="" class="title-icon">
                    Рекомендуем
                </div>
                <div class="see-all-btn">Все →</div>
            </div>

            <div class="recommend-grid" id="recommendGrid"></div>
        </div>

        <div style="height: 20px;"></div>
    </div>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-nav="home">
            <img src="assets/icons/home.svg" alt="" class="nav-icon">
            <span>Главная</span>
        </div>

        <div class="nav-item" data-nav="catalog">
            <img src="assets/icons/grid.svg" alt="" class="nav-icon">
            <span>Каталог</span>
        </div>

        <div class="nav-item" data-nav="cart">
            <img src="assets/icons/cart.svg" alt="" class="nav-icon">
            <span>Корзина</span>
        </div>

        <div class="nav-item" data-nav="profile">
            <img src="assets/icons/profile.svg" alt="" class="nav-icon">
            <span>Профиль</span>
        </div>
    </nav>

    <!-- Затемнение -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <!-- Модалка категории -->
    <div class="modal-sheet" id="categoryModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <img id="categoryModalIcon" class="modal-icon-img" src="" alt="">
            <div class="modal-title" id="categoryModalTitle"></div>
            <button class="modal-close" data-close="categoryModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div class="subcategory-list" id="categoryModalList"></div>
    </div>

    <!-- Модалка подкатегории -->
    <div class="modal-sheet" id="subcatProductsModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <img id="subcatProductsModalIcon" class="modal-icon-img" src="" alt="">
            <div class="modal-title" id="subcatProductsModalTitle"></div>
            <button class="modal-close" data-close="subcatProductsModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div class="subcat-products-grid" id="subcatProductsGrid"></div>
    </div>

    <!-- Модалка товара -->
    <div class="modal-sheet" id="productModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <div class="modal-title">Товар</div>
            <button class="modal-close" data-close="productModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div id="productModalContent"></div>
    </div>

    <!-- Модалка QR -->
    <div class="modal-sheet" id="qrModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <img src="assets/icons/camera.svg" class="modal-icon-img" alt="">
            <div class="modal-title">Сканер QR-кода</div>
            <button class="modal-close" data-close="qrModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div class="qr-modal-content">
            <div class="qr-scanner-visual">
                <img src="assets/icons/qr.svg" alt="">
            </div>
            <div class="qr-modal-text">Наведите камеру на QR-код</div>
            <div class="qr-modal-subtext">Сканируйте QR-коды товаров для быстрого перехода к карточке</div>
            <button class="btn btn-primary qr-start-btn" id="qrStartBtn" type="button">Начать сканирование</button>
        </div>
    </div>

    <!-- Модалка корзины -->
    <div class="modal-sheet" id="cartModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <img src="assets/icons/bag.svg" class="modal-icon-img" alt="">
            <div class="modal-title">Корзина</div>
            <button class="modal-close" data-close="cartModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div id="cartModalContent"></div>
    </div>

    <!-- Модалка избранного -->
    <div class="modal-sheet" id="favModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <img src="assets/icons/heart-filled.svg" class="modal-icon-img" alt="">
            <div class="modal-title">Избранное</div>
            <button class="modal-close" data-close="favModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div id="favModalContent"></div>
    </div>

    <!-- Модалка профиля -->
    <div class="modal-sheet" id="profileModal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <img src="assets/icons/profile.svg" class="modal-icon-img" alt="">
            <div class="modal-title">Профиль</div>
            <button class="modal-close" data-close="profileModal" type="button">
                <img src="assets/icons/close.svg" alt="">
            </button>
        </div>
        <div id="profileModalContent"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/script.js"></script>
</body>
</html>
